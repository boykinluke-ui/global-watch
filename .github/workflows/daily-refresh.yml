name: Refresh Global Watch data

on:
  workflow_dispatch:
  schedule:
    # Run at a non-round UTC minute to reduce schedule congestion.
    - cron: '17 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: global-watch-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector requirements
        run: python -m pip install -r backend/requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Refresh approved feeds and build static site data
        env:
          GW_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GW_TIMEZONE: America/Chicago
          GW_DAILY_RUN: 'true'
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python scripts/update_and_export.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

